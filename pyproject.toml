[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "macr-runtime"
version = "0.6.0a1"
description = "Migration-first heterogeneous multi-AI collaboration runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-genai>=2.17,<3",
  "Pillow>=12.3,<13",
]

[project.scripts]
macr = "macr_runtime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
macr_runtime = ["direct_ui/*.html", "direct_ui/*.js", "direct_ui/*.css"]
