[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "macr-runtime"
version = "0.2.0"
description = "Migration-first heterogeneous multi-AI collaboration runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
macr = "macr_runtime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
